; ══════════════════════════════════════════════════════════════
; E-Benta Production PHP Upload & Resource Configuration
; ══════════════════════════════════════════════════════════════

upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
max_file_uploads = 20

; Disable direct startup warning and error output in HTTP responses
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
